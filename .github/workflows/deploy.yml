name: AegisSentinel CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run Automated Test Suite & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx hypothesis greenlet

      - name: Run Domain & Integration Tests
        run: |
          python -m pytest --cov=backend --cov-report=term-missing

  deploy:
    name: Auto Deploy to Vultr Cloud Compute
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Package Application Release
        run: |
          echo "[*] Packaging production artifacts..."
          tar -czf /tmp/aegis_release.tar.gz backend frontend sandboxes docker-compose.yml Caddyfile alembic.ini
          ls -lh /tmp/aegis_release.tar.gz

      - name: Deploy to Vultr Host via SSH & SFTP
        env:
          SSHPASS: ${{ secrets.VULTR_PASS }}
          TARGET_HOST: ${{ secrets.VULTR_HOST }}
          TARGET_USER: ${{ secrets.VULTR_USER || 'root' }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          DOMAIN: ${{ secrets.DOMAIN || 'mcpbox.app' }}
        run: |
          echo "[*] Installing sshpass for secure deployment..."
          sudo apt-get update -y && sudo apt-get install -y sshpass

          echo "[*] Transferring release archive to ${TARGET_USER}@${TARGET_HOST}..."
          sshpass -e scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 /tmp/aegis_release.tar.gz "${TARGET_USER}@${TARGET_HOST}:/tmp/aegis_release.tar.gz"

          echo "[*] Executing remote deployment script on Vultr host..."
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 "${TARGET_USER}@${TARGET_HOST}" bash -s << 'REMOTE_SCRIPT'
            set -e
            echo "[*] Connected to Vultr Cloud Compute server..."
            mkdir -p /opt/aegis-sentinel /opt/aegis-sentinel/data/audit /opt/aegis-sentinel/data/secrets /opt/aegis-sentinel/data/workspaces

            echo "[*] Extracting release archive..."
            tar -xzf /tmp/aegis_release.tar.gz -C /opt/aegis-sentinel
            cd /opt/aegis-sentinel

            echo "[*] Rebuilding and launching Docker containers..."
            docker compose down || true
            docker compose up -d --build

            echo "[*] Running database migrations..."
            docker compose exec -T backend python -m alembic upgrade head || true

            echo "[*] Verifying container status..."
            docker compose ps
            echo "[+] Deployment completed successfully!"
          REMOTE_SCRIPT
